<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Simba Paint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="pencil" title="Pencil (P)">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
        <button class="tool-btn" data-tool="brush" title="Brush (B)">
          <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
          <svg viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83l3.85 3.85c.39.39.9.59 1.41.59h8.29c.53 0 1.04-.21 1.41-.59l3.86-3.85c.78-.78.78-2.05 0-2.83L10.27 3.59c-.39-.39-.9-.59-1.41-.59h-3.72zm-3.72 2l9.44 9.44-3.86 3.86H8.71l-3.85-3.86L14.3 5h-2.88z"/></svg>
        </button>
        <button class="tool-btn" data-tool="fill" title="Fill Bucket (G)">
          <svg viewBox="0 0 24 24"><path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10L10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/></svg>
        </button>
        <button class="tool-btn" data-tool="eyedropper" title="Color Picker (I)">
          <svg viewBox="0 0 24 24"><path d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12c.4-.4.4-1.03.01-1.42zM6.92 19L5 17.08l8.06-8.06 1.92 1.92L6.92 19z"/></svg>
        </button>
      </div>
      
      <div class="tool-group">
        <button class="tool-btn" data-tool="line" title="Line (L)">
          <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="triangle" title="Triangle (T)">
          <svg viewBox="0 0 24 24"><polygon points="12,4 3,20 21,20" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Text (X)">
          <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4H5z"/></svg>
        </button>
      </div>
      
      <div class="tool-group">
        <button class="tool-btn" data-tool="select" title="Select (S)">
          <svg viewBox="0 0 24 24"><path d="M3 5h2V3H3v2zm0 8h2v-2H3v2zm4 8h2v-2H7v2zM3 9h2V7H3v2zm10-6h-2v2h2V3zm6 0v2h2V3h-2zM5 21v-2H3v2h2zm-2-4h2v-2H3v2zM9 3H7v2h2V3zm2 18h2v-2h-2v2zm8-8h2v-2h-2v2zm0 8v-2h-2v2h2zm0-12h2V7h-2v2zm0 8h2v-2h-2v2zm-4 4h2v-2h-2v2zm0-16h2V3h-2v2z"/></svg>
        </button>
      </div>
      
      <div class="tool-group">
        <label class="tool-label">Size:</label>
        <input type="range" id="brush-size" min="1" max="50" value="3" class="size-slider">
        <span id="size-value" class="size-value">3</span>
      </div>
      
      <div class="tool-group">
        <label class="tool-label">Fill:</label>
        <input type="checkbox" id="fill-shape" class="fill-checkbox">
      </div>
      
      <div class="tool-group color-group">
        <div class="color-picker-container">
          <div class="color-swatch-wrapper">
            <input type="color" id="primary-color" value="#000000" class="color-input">
            <div class="color-swatch primary" id="primary-swatch"></div>
          </div>
          <div class="color-swatch-wrapper secondary-wrapper">
            <input type="color" id="secondary-color" value="#ffffff" class="color-input">
            <div class="color-swatch secondary" id="secondary-swatch"></div>
          </div>
        </div>
        <div class="color-palette" id="color-palette"></div>
      </div>
      
      <div class="tool-group zoom-group">
        <button class="zoom-btn" id="zoom-out" title="Zoom Out">−</button>
        <span id="zoom-level" class="zoom-level">100%</span>
        <button class="zoom-btn" id="zoom-in" title="Zoom In">+</button>
      </div>
    </div>
    
    <!-- Canvas Area -->
    <div class="canvas-container" id="canvas-container">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="main-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
      </div>
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="cursor-pos">0, 0 px</span>
      <span id="canvas-size">800 x 600 px</span>
      <span id="file-name">Untitled</span>
    </div>
  </div>
  
  <!-- Resize Dialog -->
  <div class="modal" id="resize-modal">
    <div class="modal-content">
      <h3>Resize Canvas</h3>
      <div class="modal-body">
        <div class="input-group">
          <label for="resize-width">Width:</label>
          <input type="number" id="resize-width" value="800" min="1" max="4096">
          <span>px</span>
        </div>
        <div class="input-group">
          <label for="resize-height">Height:</label>
          <input type="number" id="resize-height" value="600" min="1" max="4096">
          <span>px</span>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="resize-cancel">Cancel</button>
        <button class="btn btn-primary" id="resize-ok">OK</button>
      </div>
    </div>
  </div>
  
  <!-- Text Input Dialog -->
  <div class="modal" id="text-modal">
    <div class="modal-content">
      <h3>Add Text</h3>
      <div class="modal-body">
        <div class="input-group">
          <label for="text-input">Text:</label>
          <input type="text" id="text-input" placeholder="Enter text...">
        </div>
        <div class="input-group">
          <label for="text-font">Font:</label>
          <select id="text-font">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
            <option value="Verdana">Verdana</option>
            <option value="Comic Sans MS">Comic Sans MS</option>
          </select>
        </div>
        <div class="input-group">
          <label for="text-size">Size:</label>
          <input type="number" id="text-size" value="24" min="8" max="200">
          <span>px</span>
        </div>
        <div class="input-group">
          <label>
            <input type="checkbox" id="text-bold"> Bold
          </label>
          <label>
            <input type="checkbox" id="text-italic"> Italic
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="text-cancel">Cancel</button>
        <button class="btn btn-primary" id="text-ok">OK</button>
      </div>
    </div>
  </div>
  
  <!-- Scale Image Dialog -->
  <div class="modal" id="scale-modal">
    <div class="modal-content">
      <h3>Scale Image</h3>
      <div class="modal-body">
        <div class="input-group">
          <label>Current Size:</label>
          <span id="scale-current-size">800 x 600 px</span>
        </div>
        <div class="input-group">
          <label for="scale-ratio">Scale Ratio:</label>
          <select id="scale-ratio">
            <option value="0.1">10% (1/10)</option>
            <option value="0.2">20% (1/5)</option>
            <option value="0.25">25% (1/4)</option>
            <option value="0.5">50% (1/2)</option>
            <option value="0.75">75% (3/4)</option>
            <option value="1" selected>100% (Original)</option>
            <option value="1.5">150%</option>
            <option value="2">200% (2x)</option>
            <option value="custom">Custom...</option>
          </select>
        </div>
        <div class="input-group" id="custom-ratio-group" style="display: none;">
          <label for="scale-custom">Custom %:</label>
          <input type="number" id="scale-custom" value="100" min="1" max="1000">
          <span>%</span>
        </div>
        <div class="input-group">
          <label>New Size:</label>
          <span id="scale-new-size">800 x 600 px</span>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="scale-cancel">Cancel</button>
        <button class="btn btn-primary" id="scale-ok">Scale</button>
      </div>
    </div>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
